name: Bug or UI problem
description: Report incorrect behavior, broken layout, or a reproducible error
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        English and Chinese reports are welcome. For installation failures or model/CLI/MCP connection problems, use the dedicated forms instead.
        Remove API keys, tokens, private paths, workspace data, and sensitive model content. Report security vulnerabilities privately via [Security](https://github.com/ling-stack-org/ling-stack/security/advisories/new).
  - type: input
    id: commit
    attributes:
      label: Affected version or commit
      description: Use a release version when available; otherwise provide the commit SHA.
      placeholder: 0.1.2-alpha.1 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected module
      options:
        - Conversations and channels
        - AI teammates and memory
        - Settings and model workbench
        - Approvals and permissions
        - Skills, plugins, and tools
        - Media production
        - Desktop shell and Computer Use
        - CLI
        - Daemon or API
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS version, architecture, and Desktop or Web mode. For Web, include the browser. Node version is only needed when running from source or CLI.
      placeholder: macOS 15 arm64, Desktop app from a GitHub Release
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest deterministic sequence that demonstrates the problem.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Describe what should happen and what happens instead.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Add screenshots, console output, or logs after removing secrets, private paths, and personal data.
  - type: textarea
    id: layout
    attributes:
      label: UI details (if relevant)
      description: Include theme, language, window size or display scaling, and whether the sidebar is expanded. Screenshots can be attached above.
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Explain what work is blocked, whether data is at risk, and whether a workaround exists.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I removed credentials, private paths, workspace data, and sensitive model content.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
