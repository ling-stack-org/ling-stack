name: Feature request
description: Suggest a new capability or an improvement to an existing workflow
title: "[Proposal]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        English and Chinese reports are welcome. Describe the user problem and desired result; an implementation design is not required.
        Do not include API keys, tokens, private paths, workspace data, or sensitive model content. Report vulnerabilities through the private [Security](https://github.com/ling-stack-org/ling-stack/security/advisories/new) flow.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cannot the user accomplish today, and who experiences the problem?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result without prescribing an implementation too early.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Current and proposed workflow
      description: Show the important steps before and after the change.
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Conversations and channels
        - AI teammates and memory
        - Models and providers
        - Skills and plugins
        - MCP and tools
        - Media production
        - Approvals and security
        - Desktop and Computer Use
        - CLI, daemon, or API
        - Documentation and contributor experience
        - Other
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries and risks
      description: Consider permissions, secrets, external actions, storage, migration, platform support, and backward compatibility.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I described a user outcome rather than only a preferred UI or technology.
          required: true
        - label: I removed credentials and private data; this is not a vulnerability report.
          required: true
