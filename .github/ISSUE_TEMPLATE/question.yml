name: Usage question
description: Ask how to use Ling Stack or configure an existing capability
title: "[Question]: "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        English and Chinese questions are welcome. Read the [Quick Start](https://github.com/ling-stack-org/ling-stack#quick-start-from-source) and [Support](https://github.com/ling-stack-org/ling-stack/blob/main/SUPPORT.md) first.
        Use the installation or integration forms for failures in those areas. Never paste API keys, tokens, private paths, workspace data, or sensitive model content. Report vulnerabilities privately through [Security](https://github.com/ling-stack-org/ling-stack/security/advisories/new).
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include safe commands and redacted output.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include app version or commit, OS, architecture, and Desktop or Web mode. Node version is only needed when running from source or CLI.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I read the Quick Start and Support documents.
          required: true
        - label: I removed credentials, private paths, and private workspace data.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
