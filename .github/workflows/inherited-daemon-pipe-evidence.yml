name: Windows inherited daemon pipe evidence

on:
  push:
    branches: [codex/verify-installed-windows-plugin-modes]
    paths: [.github/workflows/inherited-daemon-pipe-evidence.yml]

permissions:
  contents: read

jobs:
  pipe:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Verify and unpack the Desktop Electron runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'electron-win32-x64.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'electron-runtime'
          curl.exe --fail --location --retry 2 'https://github.com/electron/electron/releases/download/v45.3.1/electron-v45.3.1-win32-x64.zip' --output $archive
          if ($LASTEXITCODE -ne 0) { throw 'Electron download failed.' }
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne 'd92d1aa4700e3a7e7f174731f5086ebd9c21f9773e642b260160fe0a6ebe12d2') { throw 'Electron archive digest changed.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ('LING_PIPE_ELECTRON_EXE=' + (Join-Path $destination 'electron.exe'))
      - name: Check inherited pipe I/O and reject a regular file
        shell: pwsh
        run: |
          @'
          import assert from 'node:assert/strict';
          import { spawn } from 'node:child_process';
          import { once } from 'node:events';
          import { closeSync, openSync } from 'node:fs';
          import { join } from 'node:path';

          const code = `
            import assert from 'node:assert/strict';
            import { fstatSync } from 'node:fs';
            import { Socket } from 'node:net';
            const channels = [3, 4, 5];
            const types = channels.map(fd => {
              const stat = fstatSync(fd);
              return { fd, mode: stat.mode, fifo: stat.isFIFO(), socket: stat.isSocket(), character: stat.isCharacterDevice() };
            });
            console.log(JSON.stringify({ electron: process.versions.electron, node: process.versions.node, uv: process.versions.uv, types }));
            assert.equal(fstatSync(6).isFile(), true);
            assert.throws(() => new Socket({ fd: 6, readable: false }), { code: 'ERR_INVALID_FD_TYPE' });
            const sockets = channels.map(fd => new Socket({ fd, readable: false, writable: true }));
            const write = (socket, bytes) => new Promise((resolve, reject) => {
              socket.once('error', reject); socket.write(bytes, resolve);
            });
            const end = (socket, bytes) => new Promise((resolve, reject) => {
              socket.once('error', reject); socket.end(bytes, resolve);
            });
            await write(sockets[2], 'draining,');
            await Promise.all([end(sockets[0], 'authority'), end(sockets[1], 'ready'), end(sockets[2], 'blocked')]);
          `;
          const file = openSync(join(process.env.RUNNER_TEMP, 'regular-descriptor.txt'), 'wx+');
          const verify = async (source) => {
            const child = spawn(process.env.LING_PIPE_ELECTRON_EXE, ['--input-type=module', '-e', source], {
              env: { ...process.env, ELECTRON_RUN_AS_NODE: '1' },
              stdio: ['ignore', 'pipe', 'inherit', 'pipe', 'pipe', 'pipe', file],
            });
            const exited = once(child, 'close');
            const read = async (stream) => {
              let data = '';
              for await (const chunk of stream) data += chunk.toString('utf8');
              return data;
            };
            const [stdout, ...receipts] = await Promise.all([1, 3, 4, 5].map(index => read(child.stdio[index])));
            console.log(stdout.trim());
            assert.equal((await exited)[0], 0);
            assert.deepEqual(receipts, ['authority', 'ready', 'draining,blocked']);
          };
          try {
            await verify(code);
            console.log('Stream I/O and regular-file rejection passed.');
            await verify(`
              import assert from 'node:assert/strict';
              import { closeSync, constants, fstatSync, writeSync } from 'node:fs';
              const fifo = fd => (fstatSync(fd).mode & constants.S_IFMT) === constants.S_IFIFO;
              assert.ok([3, 4, 5].every(fifo));
              assert.equal(fifo(6), false);
              for (const [fd, text] of [[5, 'draining,'], [3, 'authority'], [4, 'ready'], [5, 'blocked']]) {
                const bytes = Buffer.from(text);
                assert.equal(writeSync(fd, bytes, 0, bytes.length), bytes.length);
              }
              for (const fd of [3, 4, 5]) closeSync(fd);
              console.log(JSON.stringify({ fifoMode: constants.S_IFIFO, typeMask: constants.S_IFMT }));
            `);
            console.log('Exact FIFO-mode check and synchronous pipe writes passed.');
          } finally { closeSync(file); }
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { throw 'Inherited daemon pipe probe failed.' }
      - name: Verify the daemon command pipe and a clean Electron child exit
        shell: pwsh
        run: |
          @'
          import assert from 'node:assert/strict';
          import { spawn } from 'node:child_process';
          import { once } from 'node:events';

          const source = `
            import assert from 'node:assert/strict';
            import { closeSync, constants, fstatSync, writeSync } from 'node:fs';
            import { Socket } from 'node:net';
            assert.equal(fstatSync(6).mode & constants.S_IFMT, constants.S_IFIFO);
            const input = new Socket({ fd: 6, readable: true, writable: false });
            let request = '';
            for await (const chunk of input) request += chunk.toString('utf8');
            assert.equal(request, 'shutdown\\n');
            assert.equal(writeSync(5, 'draining'), 8);
            closeSync(5);
          `;
          const child = spawn(process.env.LING_PIPE_ELECTRON_EXE, ['--input-type=module', '-e', source], {
            env: { ...process.env, ELECTRON_RUN_AS_NODE: '1' },
            stdio: ['ignore', 'ignore', 'inherit', 'ignore', 'ignore', 'pipe', 'pipe'],
          });
          const exited = once(child, 'close');
          let phase = '';
          child.stdio[5].on('data', chunk => { phase += chunk.toString('utf8'); });
          child.stdio[6].end('shutdown\n');
          assert.deepEqual(await exited, [0, null]);
          assert.equal(phase, 'draining');
          console.log('FD6 command and EOF delivered before the daemon exit receipt.');
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { throw 'Owned Windows daemon shutdown probe failed.' }
