name: Native model cache contracts

on:
  pull_request:
    paths:
      - scripts/gstack/testsavant-model-*.mjs
      - scripts/gstack/testsavant-model-pin.json
      - .github/workflows/model-cache-contracts.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-cache-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.1
      - name: Verify model cache safety and bounded concurrent orphan recovery
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/gstack/testsavant-model-cache.test.mjs scripts/gstack/testsavant-model-state.test.mjs
          node --input-type=module <<'NODE'
          import { spawnSync } from "node:child_process";
          for (let attempt = 1; attempt <= 20; attempt++) {
            console.log(`Native orphan-lock recovery sample ${attempt}/20`);
            const result = spawnSync(process.execPath, ["--test", "--test-name-pattern=^an empty orphaned lock",
              "scripts/gstack/testsavant-model-cache.test.mjs"], { stdio: "inherit" });
            if (result.error) throw result.error;
            if (result.status !== 0) process.exit(result.status ?? 1);
          }
          NODE
