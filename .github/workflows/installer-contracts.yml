name: Native installer contracts

on:
  pull_request:
    paths:
      - scripts/release/verify-nsis-plugins.mjs
      - scripts/release/nsis-extractor.mjs
      - scripts/ci/desktop-bun-entry.test.mjs
      - scripts/gstack/packaged-browse-build.mjs
      - apps/desktop/tests/distribution-nsis-native.test.mjs
      - apps/desktop/scripts/distribution/installer-builder.mjs
      - apps/desktop/scripts/distribution/LingShell.nsh
      - apps/desktop/scripts/distribution/vendor-notices/nsis-plugins/sources.json
      - .github/workflows/installer-contracts.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.1
          cache: pnpm
      - name: Install locked dependencies without build hooks
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Check compiled browser entry lifecycle on the native host
        shell: pwsh
        run: |
          $env:LING_BUN_ENTRY_PROBE_BINARY = (Get-Command bun).Source
          node --test scripts/ci/desktop-bun-entry.test.mjs
      - name: Check actual NSIS archive plug-in bytes on Windows
        run: node --test apps/desktop/tests/distribution-nsis-native.test.mjs
