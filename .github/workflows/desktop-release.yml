name: Desktop release candidate

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-draft:
    uses: ./.github/workflows/desktop-prerelease.yml
    with:
      operation: build
      source_sha: ${{ github.sha }}
      release_tag: ${{ github.ref_name }}
      create_draft: true
    secrets: inherit
