name: Sync provider model catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

concurrency:
  group: provider-model-catalog-sync
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.15.0

      - name: Refresh reviewed catalog data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/provider-model-catalog"
          git fetch origin main "$branch" || git fetch origin main
          git checkout -B "$branch" origin/main
          node scripts/sync-provider-model-catalog.mjs
          git add packages/core/src/provider-model-catalog.generated.ts
          if git diff --cached --quiet; then
            echo "Catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh provider model catalog"
          git push --force-with-lease origin "HEAD:$branch"
          if gh pr view "$branch" --json url >/dev/null 2>&1; then
            gh pr edit "$branch" --title "chore: refresh provider model catalog" --body "Automated reviewed data refresh from the MIT-licensed models.dev catalog. This PR changes metadata only and does not enable provider adapters or runtime permissions."
          else
            gh pr create --base main --head "$branch" --title "chore: refresh provider model catalog" --body "Automated reviewed data refresh from the MIT-licensed models.dev catalog. This PR changes metadata only and does not enable provider adapters or runtime permissions."
          fi
