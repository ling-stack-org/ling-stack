name: CI

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  scope:
    name: Determine CI scope
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      packages: ${{ steps.classify.outputs.packages }}
      test-packages: ${{ steps.classify.outputs.test-packages }}
      typecheck-packages: ${{ steps.classify.outputs.typecheck-packages }}
      daemon: ${{ steps.classify.outputs.daemon }}
      web: ${{ steps.classify.outputs.web }}
    steps:
      - name: Check out repository without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.1

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FORCE_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            scope_json="$(node scripts/ci/classify-scope.mjs \
              --event="$GITHUB_EVENT_NAME" \
              --base="$BASE_SHA" \
              --head=HEAD \
              --force-full="$FORCE_FULL")"
          else
            scope_json="$(node scripts/ci/classify-scope.mjs --event="$GITHUB_EVENT_NAME")"
          fi
          echo "Scope: $scope_json"
          SCOPE_JSON="$scope_json" node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          const scope = JSON.parse(process.env.SCOPE_JSON);
          const outputs = {
            mode: scope.mode,
            packages: JSON.stringify(scope.packages),
            "test-packages": JSON.stringify(scope.testPackages),
            "typecheck-packages": JSON.stringify(scope.typecheckPackages),
            daemon: String(scope.daemon),
            web: String(scope.web),
          };
          for (const [key, value] of Object.entries(outputs)) console.log(`${key}=${value}`);
          NODE

  common-fast:
    name: Common checks (fast lane)
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.1

      - name: Check Markdown links
        run: node scripts/check-markdown-links.mjs

      - name: Check public repository safety
        run: node scripts/check-public-repo-safety.mjs

      - name: Check scanner boundaries and runtime baseline
        run: node --test scripts/check-public-repo-safety.test.mjs scripts/ci/runtime-baseline.test.mjs

      - name: Scan Git history for secrets
        if: needs.scope.outputs.mode != 'docs'
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo:ro"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --no-banner --no-color --redact=100
          --config /repo/.gitleaks.toml
          --gitleaks-ignore-path /repo/.gitleaksignore
          --timeout 600
          /repo

      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

      - name: Check pushed or scheduled commit whitespace
        if: github.event_name != 'pull_request'
        run: git diff-tree --check --no-commit-id -r HEAD

  dependency-policy:
    name: Dependency policy and security checks
    needs: scope
    if: needs.scope.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.0.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.1
          cache: pnpm

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile --prefer-offline

      - name: Check dependency license policy
        run: corepack pnpm check:licenses

      - name: Check patched dependency security regressions
        run: corepack pnpm check:dependency-security

  build:
    name: Build selected package graph once
    needs: scope
    if: needs.scope.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SELECTED_PACKAGES: ${{ needs.scope.outputs.packages }}
    steps:
      - name: Check out repository without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.0.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.1
          cache: pnpm

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile --prefer-offline

      - name: Build selected graph without nested package builds
        run: node scripts/ci/run-packages.mjs --task=build:ci --packages="$SELECTED_PACKAGES" --closure=true

      - name: Upload reusable build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-dist
          if-no-files-found: error
          retention-days: 1
          path: |
            packages/*/dist/**
            apps/web/dist/**
            apps/chrome-extension/dist/**

  typecheck:
    name: Typecheck selected packages
    needs: [scope, build]
    if: always() && needs.scope.outputs.mode != 'docs' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SELECTED_PACKAGES: ${{ needs.scope.outputs.typecheck-packages }}
    steps:
      - name: Check out repository without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.0.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.1
          cache: pnpm

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile --prefer-offline

      - name: Download reusable build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ci-dist
          path: .

      - name: Typecheck selected packages without rebuilding dependencies
        run: node scripts/ci/run-packages.mjs --task=typecheck:ci --packages="$SELECTED_PACKAGES"

  unit-tests:
    name: Unit tests and Web checks
    needs: [scope, build]
    if: always() && needs.scope.outputs.mode != 'docs' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SELECTED_PACKAGES: ${{ needs.scope.outputs.test-packages }}
      WEB_SELECTED: ${{ needs.scope.outputs.web }}
    steps:
      - name: Check out repository without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.0.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.1
          cache: pnpm

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile --prefer-offline

      - name: Download reusable build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ci-dist
          path: .

      - name: Run selected unit tests without rebuilding dependencies
        run: node scripts/ci/run-packages.mjs --task=test:ci --packages="$SELECTED_PACKAGES" --exclude='["@ling-stack/daemon"]'

      - name: Check Web architecture and UI rules
        if: env.WEB_SELECTED == 'true'
        run: corepack pnpm --filter @ling-stack/web lint

      - name: Check translations
        if: env.WEB_SELECTED == 'true'
        run: corepack pnpm --filter @ling-stack/web check:i18n

  daemon-tests:
    name: Daemon tests (shard ${{ matrix.shard }})
    needs: [scope, build]
    if: always() && needs.scope.outputs.daemon == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    # Daemon tests start an isolated runtime for each integration fixture. As
    # the suite grows, the heaviest shard can legitimately exceed the generic
    # 15-minute job budget even when every test is progressing and passing.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out repository without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.0.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.1
          cache: pnpm

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile --prefer-offline

      - name: Download reusable build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ci-dist
          path: .

      - name: Run isolated daemon shard
        run: node scripts/ci/daemon-test-shard.mjs --shard=${{ matrix.shard }} --shard-count=4

  quality:
    name: Typecheck, unit tests, and Web build
    needs: [scope, common-fast, dependency-policy, build, typecheck, unit-tests, daemon-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable CI lane to pass
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          COMMON_RESULT: ${{ needs.common-fast.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-policy.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          DAEMON_RESULT: ${{ needs.daemon-tests.result }}
        shell: bash
        run: |
          set -euo pipefail
          failures=()
          for lane in SCOPE COMMON DEPENDENCY BUILD TYPECHECK UNIT DAEMON; do
            result_var="${lane}_RESULT"
            result="${!result_var}"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              failures+=("$lane=$result")
            fi
          done
          if (( ${#failures[@]} > 0 )); then
            printf 'CI lanes failed: %s\n' "${failures[*]}"
            exit 1
          fi
          echo "All applicable CI lanes passed; skipped lanes were outside this change scope."
