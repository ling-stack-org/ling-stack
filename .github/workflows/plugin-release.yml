name: Plugin release artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Plugin release tag
        required: true
        type: string
      source_sha:
        description: Reviewed source SHA
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: cua-driver
            platform: darwin
            arch: arm64
          - plugin: cua-driver
            platform: darwin
            arch: x64
          - plugin: cua-driver
            platform: win32
            arch: x64
          - plugin: chrome-browser
            platform: darwin
            arch: arm64
          - plugin: chrome-browser
            platform: win32
            arch: x64
          - plugin: office-documents
            platform: darwin
            arch: arm64
          - plugin: office-documents
            platform: win32
            arch: x64
    runs-on: ${{ matrix.platform == 'darwin' && 'macos-14' || matrix.platform == 'win32' && 'windows-2025' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.1
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - name: Validate reviewed source ref
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$RELEASE_TAG" =~ ^plugins-[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin main --quiet
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
      - run: corepack pnpm install --frozen-lockfile
      - name: Build Chrome extension
        if: matrix.plugin == 'chrome-browser'
        run: |
          corepack pnpm --filter @ling-stack/chrome-extension build
          corepack pnpm --filter @ling-stack/browser-host build:native
      - name: Build Office helper
        if: matrix.plugin == 'office-documents'
        run: corepack pnpm --filter @ling-stack/desktop exec node scripts/build-office-driver.mjs --platform=${{ matrix.platform }}-${{ matrix.arch }}
      - name: Stage plugin runtime
        if: matrix.plugin != 'cua-driver'
        env:
          PLUGIN_KIND: ${{ matrix.plugin }}
          PLUGIN_PLATFORM: ${{ matrix.platform }}
          PLUGIN_ARCH: ${{ matrix.arch }}
        run: |
          host_suffix=""
          helper_path="ling-office-driver.exe"
          if [ "$PLUGIN_PLATFORM" = "win32" ]; then host_suffix=".exe"; fi
          if [ "$PLUGIN_PLATFORM" = "darwin" ]; then helper_path="OfficeDriver.app/Contents/MacOS/ling-office-driver"; fi
          node scripts/plugins/stage-runtime-plugin.mjs --kind "$PLUGIN_KIND" --platform "$PLUGIN_PLATFORM" --extension apps/chrome-extension/ling-for-chrome.zip --host "packages/browser-host/dist/native/ling-browser-host${host_suffix}" --helper "apps/desktop/dist/office-driver/${PLUGIN_PLATFORM}-${PLUGIN_ARCH}/${helper_path}" --output "plugins/staged/${PLUGIN_KIND}"
      - name: Package plugin artifact
        env:
          LING_PLUGIN_ARTIFACT_PRIVATE_KEY: ${{ secrets.LING_PLUGIN_ARTIFACT_PRIVATE_KEY }}
          PLUGIN_ROOT: ${{ matrix.plugin == 'cua-driver' && format('packages/daemon/src/features/plugins/bundled/{0}', matrix.plugin) || format('plugins/staged/{0}', matrix.plugin) }}
          PLUGIN_PLATFORM: ${{ matrix.platform }}
          PLUGIN_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node scripts/plugins/package-plugin.mjs --root "$PLUGIN_ROOT" --platform "$PLUGIN_PLATFORM" --arch "$PLUGIN_ARCH" --channel stable --releaseTag "$RELEASE_TAG" --sourceSha "$SOURCE_SHA" --output plugins/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: plugin-${{ matrix.plugin }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: plugins/dist/*

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: plugins/dist
          pattern: plugin-*
          merge-multiple: true
      - name: Build plugin SDK
        run: corepack pnpm --filter @ling-stack/plugin-sdk build
      - name: Generate catalog
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node scripts/plugins/generate-catalog.mjs --input plugins/dist --output plugins/catalog.json --releaseTag "$RELEASE_TAG" --sourceSha "$SOURCE_SHA"
      - run: node scripts/plugins/verify-catalog-assets.mjs --input plugins/dist --catalog plugins/catalog.json
      - name: Sign catalog
        env:
          LING_PLUGIN_CATALOG_PRIVATE_KEY: ${{ secrets.LING_PLUGIN_CATALOG_PRIVATE_KEY }}
        run: node scripts/plugins/sign-catalog.mjs --input plugins/catalog.json --output plugins/catalog.sig
      - name: Create draft release and upload plugin assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          gh release create "$RELEASE_TAG" --draft --title "Ling plugins $RELEASE_TAG" --notes "Official Ling plugin artifacts for $SOURCE_SHA"
          gh release upload "$RELEASE_TAG" plugins/dist/*.ling-plugin.zip plugins/dist/*.ling-plugin.zip.json plugins/catalog.json plugins/catalog.sig
