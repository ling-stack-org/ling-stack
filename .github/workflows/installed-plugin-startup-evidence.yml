name: Windows installed plugin startup evidence

on:
  push:
    branches: [codex/verify-installed-windows-plugin-modes]
    paths: [.github/workflows/installed-plugin-startup-evidence.yml]

permissions:
  actions: read
  contents: read

jobs:
  startup:
    name: Installed Desktop startup (${{ matrix.mode }})
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: on-demand
            run_id: '45060119665'
            artifact_id: '14770958078'
            installer_sha256: 2a372e1042d2ef36d137f17fd2cabf4cf915c3278156765eb96b6805213ab673
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: ${{ matrix.run_id }}
          artifact-ids: ${{ matrix.artifact_id }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
      - name: Start the installed Desktop and its own daemon
        shell: pwsh
        env:
          PLUGIN_MODE: ${{ matrix.mode }}
          SOURCE_RUN_ID: ${{ matrix.run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ matrix.artifact_id }}
          EXPECTED_INSTALLER_SHA256: ${{ matrix.installer_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_ARCH -ne 'X64') {
            throw 'A fresh hosted Windows x64 runner is required.'
          }
          $setups = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'candidate') -Filter '*-windows-x64-setup.exe' -File -Recurse)
          if ($setups.Count -ne 1) { throw 'Exactly one Windows installer is required.' }
          $setup = $setups[0]
          $installerSha = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($installerSha -ne $env:EXPECTED_INSTALLER_SHA256) { throw 'Candidate installer digest changed.' }

          $root = Join-Path $env:RUNNER_TEMP ('ling-installed-' + (New-Guid).Guid)
          $install = Join-Path $root 'install'
          $profile = Join-Path $root 'profile'
          $workspace = Join-Path $root 'workspace'
          $null = New-Item -ItemType Directory -Path $root
          $null = New-Item -ItemType Directory -Path $profile, $workspace
          $env:LING_STACK_HOME = Join-Path $root 'ling-home'
          $env:LING_STACK_DEFAULT_WORKSPACE_CWD = $workspace
          $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $env:LING_STACK_DAEMON_URL = 'http://127.0.0.1:' + $listener.LocalEndpoint.Port
          $listener.Stop()

          $exe = Join-Path $install 'Ling Stack.exe'
          $uninstaller = Join-Path $install 'Uninstall Ling Stack.exe'
          try {
            $installer = Start-Process -FilePath $setup.FullName -ArgumentList @('/S', ('/D=' + $install)) -PassThru -Wait
            if ($installer.ExitCode -ne 0 -or !(Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw "Installer failed ($($installer.ExitCode))."
            }
            $env:LING_BOOTSTRAP_PROBE_EXE = $exe
            $env:LING_BOOTSTRAP_PROBE_HOME = Join-Path $root 'daemon-probe-home'
            @'
          import { spawn } from "node:child_process";
          import { existsSync } from "node:fs";
          import { dirname, join } from "node:path";
          const executable = process.env.LING_BOOTSTRAP_PROBE_EXE;
          const probeHome = process.env.LING_BOOTSTRAP_PROBE_HOME;
          const started = Date.now();
          const entry = join(dirname(executable), "resources", "app.asar", "dist", "daemon", "cli.mjs");
          const daemon = spawn(executable, [entry], {
            cwd: process.env.LING_STACK_DEFAULT_WORKSPACE_CWD,
            env: {
              ...process.env, ELECTRON_RUN_AS_NODE: "1", LING_STACK_PACKAGED_DESKTOP: "1",
              LING_STACK_HOST: "127.0.0.1", LING_STACK_PORT: "0",
              LING_STACK_HOME: probeHome,
              LING_STACK_RESOURCE_BOOTSTRAP_FD: "4",
            },
            stdio: ["ignore", "pipe", "pipe", "ignore", "pipe"], windowsHide: true,
          });
          let diagnostic = "";
          let daemonOutput = "";
          const receipt = [];
          let receiptBytes = 0;
          let receiptClosed = false;
          const observe = () => ({
            elapsedMs: Date.now() - started,
            daemonAnnouncedListening: daemonOutput.includes("Ling Stack daemon listening on http://127.0.0.1:"),
            packagedSkillCacheExists: existsSync(join(probeHome, "sources", "bundled-gstack")),
            receiptBytes, receiptClosed,
          });
          daemon.stdout.on("data", bytes => { daemonOutput = (daemonOutput + bytes.toString("utf8")).slice(-4096); });
          daemon.stderr.on("data", bytes => { diagnostic = (diagnostic + bytes.toString("utf8")).slice(-8192); });
          daemon.stdio[4].on("error", () => {});
          daemon.stdio[4].on("data", bytes => {
            receiptBytes += bytes.length;
            if (receiptBytes <= 1024) receipt.push(bytes);
          });
          let validReceipt = false;
          let readyElapsedMs;
          daemon.stdio[4].once("end", () => {
            receiptClosed = true;
            try {
              const message = JSON.parse(Buffer.concat(receipt).toString("utf8"));
              validReceipt = receiptBytes <= 1024 && message.schemaVersion === 1 && message.phase === "resources_ready" && message.pid === daemon.pid;
            } catch {}
            if (validReceipt) { readyElapsedMs = Date.now() - started; daemon.kill(); }
          });
          daemon.once("error", error => { console.error("Daemon probe process:", error.code); process.exitCode = 1; });
          const samples = setInterval(() => console.log(JSON.stringify(observe())), 30000);
          const timer = setTimeout(() => {
            console.error("Packaged daemon bootstrap probe timed out.", JSON.stringify(observe())); daemon.kill();
          }, 360000);
          daemon.once("close", (code, signal) => {
            clearTimeout(timer);
            clearInterval(samples);
            const failure = diagnostic.split(/\r?\n/u).find(line => /^(?:Error|TypeError)(?: #[^:]+| \[[A-Z0-9_]+\])?:/u.test(line));
            const reason = failure?.replace(/https?:\/\/[^\s]+/gu, "<url>").slice(0, 350);
            console.log(JSON.stringify({ ...observe(), packagedDaemonResourcesReady: validReceipt, readyElapsedMs, code, signal, reason }));
            if (!validReceipt || readyElapsedMs > 60000) process.exitCode = 1;
          });
          '@ | node --input-type=module
            if ($LASTEXITCODE -ne 0) { throw 'Packaged daemon resource bootstrap did not meet the Desktop deadline.' }
            $desktopArgs = @('--ling-desktop-smoke-headless', ('--user-data-dir="' + $profile + '"'))
            $stdout = Join-Path $root 'desktop-stdout.log'
            $stderr = Join-Path $root 'desktop-stderr.log'
            $launch = @{
              FilePath = $exe
              ArgumentList = $desktopArgs
              WorkingDirectory = $workspace
              RedirectStandardOutput = $stdout
              RedirectStandardError = $stderr
              PassThru = $true
            }
            $desktop = Start-Process @launch
            $timedOut = !$desktop.WaitForExit(180000)
            if ($timedOut -and !$desktop.HasExited) {
              $children = @(Get-CimInstance Win32_Process -Filter "ParentProcessId = $($desktop.Id)")
              Write-Host ('Desktop child process names: ' + ($children.Name -join ', '))
              $desktop.Kill($true)
              $desktop.WaitForExit()
            }
            $startupLog = Join-Path $profile 'desktop-startup.log'
            $fallbackLog = Join-Path $env:APPDATA 'Ling Stack/desktop-startup.log'
            foreach ($file in @($startupLog, $fallbackLog)) {
              if (Test-Path -LiteralPath $file -PathType Leaf) {
                $diagnosticEvents = @(Get-Content -LiteralPath $file | ForEach-Object {
                  ConvertFrom-Json -InputObject $_ -ErrorAction SilentlyContinue
                })
                Write-Host ('Startup events in ' + (Split-Path -Leaf (Split-Path -Parent $file)) + ': ' + ($diagnosticEvents.event -join ', '))
              }
            }
            $smokeMarker = Select-String -LiteralPath $stdout -SimpleMatch 'Ling Stack Desktop smoke ready' -Quiet
            Write-Host "Desktop readiness marker: $smokeMarker. Standard error bytes: $((Get-Item -LiteralPath $stderr).Length)."
            if ($timedOut) { throw 'The installed Desktop launch timed out.' }
            if (!(Test-Path -LiteralPath $startupLog -PathType Leaf)) {
              throw "Missing isolated Desktop startup log (exit $($desktop.ExitCode))."
            }
            $events = @(Get-Content -LiteralPath $startupLog | ForEach-Object { ConvertFrom-Json -InputObject $_ })
            Write-Host ('Desktop startup events: ' + ($events.event -join ', '))
            $appReady = $events | Where-Object { $_.event -eq 'app.ready' -and $_.packaged -and $_.smokeHeadless }
            $ownedDaemon = $events | Where-Object { $_.event -eq 'daemon.connected' -and $_.ownedByDesktop }
            $rendererLoaded = $events.event -contains 'main_window.loaded'
            if ($desktop.ExitCode -ne 0 -or !$appReady -or !$ownedDaemon -or !$rendererLoaded) {
              throw "The installed Desktop did not complete an owned startup (exit $($desktop.ExitCode))."
            }
            $desktopSha = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          } finally {
            if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
              $cleanup = Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait
              if ($cleanup.ExitCode -ne 0) { throw "Uninstaller failed ($($cleanup.ExitCode))." }
            }
          }
          if (Test-Path -LiteralPath $exe) { throw 'Uninstall left the installed Desktop executable.' }

          [ordered]@{
            platform = 'win32-x64'
            pluginMode = $env:PLUGIN_MODE
            sourceSha = '6e5ab9b99cf87288341ea8362adad95278220c01'
            sourceRunId = $env:SOURCE_RUN_ID
            candidateArtifactId = $env:CANDIDATE_ARTIFACT_ID
            installerSha256 = $installerSha
            executableSha256 = $desktopSha
            installedDesktopLoadedRenderer = $true
            desktopOwnedDaemonConnected = $true
            normalExit = $true
            uninstall = 'passed'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'installed-plugin-startup.json')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installed-plugin-startup-${{ matrix.mode }}
          path: ${{ runner.temp }}/installed-plugin-startup.json
          if-no-files-found: error
          retention-days: 5
