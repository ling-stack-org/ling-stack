name: Desktop prerelease
run-name: Desktop inspect · ${{ github.event.pull_request.head.sha }}
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: desktop-prerelease-inspect-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  inspect:
    if: github.event.label.name == 'desktop-package-inspect' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-26
          - target: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      DESKTOP_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      DESKTOP_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.1
          cache: pnpm
      - name: Install locked dependencies for read-only native probes
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Observe native prerequisites without granting approval
        run: |
          set -euo pipefail
          export DESKTOP_RELEASE_TAG="v$(node -p 'require("./package.json").version')"
          node scripts/release/desktop-prerequisites.mjs inspect
      - name: Retain observations and all blocked checks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-evidence-${{ matrix.target }}
          path: .codex-artifacts/desktop-release/**
          if-no-files-found: warn
          retention-days: 14
