name: Replay verified macOS installers
run-name: "Replay verified macOS DMGs"

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay:
    name: "Replay ${{ matrix.mode }} DMG"
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: bundled
            archives: "14813976689"
            archives-sha: "7622cbf96548eaa0bb284f14da899674145c0ab796b3a9d58df9119a54ce4ce7"
            evidence: "14813686720"
            evidence-sha: "314d115e8b35864051fa800e4d273684bb53395093e7d112be0959330ca8161d"
          - mode: on-demand
            archives: "14814906515"
            archives-sha: "a948235aa6faca4b0b8b386e4afd482456f5fcd734be5762cf9c88415f9a8458"
            evidence: "14815351072"
            evidence-sha: "fdf192a6edd0df0c7869fd7f41248fcb54c8259369a2450443dd69393130e706"
    env:
      DESKTOP_SOURCE_SHA: 3efb4c6fdd945737c400d6a22f8110b5671e6f28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.1
      - name: Retrieve the retained archives by immutable artifact ID
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVES_ID: ${{ matrix.archives }}
          ARCHIVES_SHA: ${{ matrix.archives-sha }}
          EVIDENCE_ID: ${{ matrix.evidence }}
          EVIDENCE_SHA: ${{ matrix.evidence-sha }}
        run: |
          set -euo pipefail
          replay="$RUNNER_TEMP/mac-replay"
          mkdir "$replay"
          for category in ARCHIVES EVIDENCE; do
            id_var="${category}_ID"
            sha_var="${category}_SHA"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/${!id_var}/zip" > "$replay/$category.zip"
            printf '%s  %s\n' "${!sha_var}" "$replay/$category.zip" | shasum -a 256 -c -
          done
          python3 - "$replay" <<'PY'
          import json
          import shutil
          import sys
          from pathlib import Path
          from zipfile import ZipFile

          directory = Path(sys.argv[1])
          with ZipFile(directory / "EVIDENCE.zip") as evidence:
              report_bytes = evidence.read("package-verification.json")
          (directory / "package-verification.json").write_bytes(report_bytes)
          report = json.loads(report_bytes)
          name = next(x["name"] for x in report["archives"] if x["name"].endswith(".dmg"))
          assert name == "Ling-Stack-0.6.1-macos-arm64.dmg"
          with ZipFile(directory / "ARCHIVES.zip") as archives:
              member = next(x for x in archives.infolist() if Path(x.filename).name == name)
              with archives.open(member) as source, (directory / name).open("xb") as dest:
                  shutil.copyfileobj(source, dest)
          PY
      - name: Check cold startup of the copied app in a canonical directory
        run: node scripts/release/macos-installed-startup.mjs "$RUNNER_TEMP/mac-replay" "$RUNNER_TEMP/mac-replay"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: macos-installed-replay-${{ matrix.mode }}
          path: ${{ runner.temp }}/mac-replay/macos-installed-startup.json
          if-no-files-found: warn
