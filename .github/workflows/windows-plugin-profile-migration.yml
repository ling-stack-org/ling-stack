name: Windows plugin profile migration evidence

on:
  push:
    branches: [codex/windows-prerelease-profile-migration]
    paths:
      - .github/workflows/windows-plugin-profile-migration.yml
      - scripts/release/windows-plugin-profile-migration.mjs

permissions:
  actions: read
  contents: read

jobs:
  migration:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: '45187207804'
          artifact-ids: '14827896338'
          merge-multiple: true
          path: ${{ runner.temp }}/bundled-candidate
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: '45293564788'
          artifact-ids: '14881634759'
          merge-multiple: true
          path: ${{ runner.temp }}/slim-candidate
          github-token: ${{ github.token }}
      - name: Download the published Windows development prerelease
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'upgrade-candidate'
          New-Item -ItemType Directory -Path $destination | Out-Null
          $release = 'https://github.com/ling-stack-org/ling-stack/releases/download/v0.6.2-alpha.1'
          foreach ($name in @('Ling-Stack-0.6.2-alpha.1-windows-x64-setup.exe', 'desktop-windows-x64-package-verification.json')) {
            curl.exe --fail --location --silent --show-error --retry 3 --max-time 600 --output (Join-Path $destination $name) "$release/$name"
            if ($LASTEXITCODE -ne 0) { throw "Failed to download $name." }
          }
      - name: Install and migrate an isolated Windows profile
        shell: pwsh
        run: |
          node scripts/release/windows-plugin-profile-migration.mjs `
            (Join-Path $env:RUNNER_TEMP 'bundled-candidate') `
            (Join-Path $env:RUNNER_TEMP 'slim-candidate') `
            (Join-Path $env:RUNNER_TEMP 'upgrade-candidate') `
            (Join-Path $env:RUNNER_TEMP 'windows-plugin-profile-migration.json')
          if ($LASTEXITCODE -ne 0) { throw 'Windows profile migration failed.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-plugin-profile-migration
          path: ${{ runner.temp }}/windows-plugin-profile-migration.json
          if-no-files-found: error
          retention-days: 14
