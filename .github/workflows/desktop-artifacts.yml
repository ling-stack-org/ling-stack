name: Desktop product artifacts

on:
  workflow_dispatch:
    inputs:
      target:
        description: Product artifact to build
        required: true
        default: macos-arm64
        type: choice
        options:
          - macos-arm64
          - windows-x64

concurrency:
  group: desktop-product-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: "true"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  macos-arm64:
    if: inputs.target == 'macos-arm64'
    name: macOS arm64 DMG
    runs-on:
      - ling-cua-driver-macos-arm64-v1
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.15.0

      - name: Enable pnpm and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Install locked Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install 1.97.1 --profile minimal --component rustfmt
          "$HOME/.cargo/bin/rustup" target add aarch64-apple-darwin --toolchain 1.97.1

      - name: Verify macOS build host
        run: node apps/desktop/scripts/verify-cua-driver-self-hosted-runner.mjs --platform darwin

      - name: Resolve local Apple Development identity
        shell: bash
        run: |
          set -euo pipefail
          identity="$(security find-identity -v -p codesigning | awk -F'"' '/Apple Development:/ { print $2; exit }')"
          test -n "$identity"

          probe="$(mktemp "${RUNNER_TEMP}/ling-codesign-probe.XXXXXX")"
          trap 'rm -f "$probe"' EXIT
          printf '#!/bin/sh\nexit 0\n' > "$probe"
          chmod 700 "$probe"
          codesign --force --sign "$identity" "$probe"
          team_id="$(codesign -dv --verbose=4 "$probe" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          [[ "$team_id" =~ ^[A-Z0-9]{10}$ ]]

          echo "LING_CUA_DARWIN_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "LING_CUA_DARWIN_EXPECTED_TEAM_ID=$team_id" >> "$GITHUB_ENV"

      - name: Run focused package contracts
        run: >-
          node --test
          apps/desktop/tests/chrome-extension-package.test.mjs
          apps/desktop/tests/cua-driver-artifact-layout.test.mjs
          apps/desktop/tests/cua-driver-electron-package.test.mjs
          apps/desktop/tests/cua-driver-darwin-platform-signer.test.mjs

      - name: Verify Native Host protocol and daemon bridge
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm --filter @ling-stack/browser-host test
          corepack pnpm --filter @ling-stack/daemon build
          node --test \
            packages/daemon/test/chrome-browser-native-broker.test.mjs \
            packages/daemon/test/chrome-browser-native-host-process.test.mjs

      - name: Build locked Cua Driver once
        shell: bash
        run: |
          set -euo pipefail
          build_root="${RUNNER_TEMP}/ling-cua-driver-product/macos"
          node apps/desktop/scripts/build-cua-driver-provider.mjs \
            --platform darwin \
            --work-dir "$build_root/work" \
            --output-dir "$build_root/output"
          node apps/desktop/scripts/verify-cua-driver-source-build.mjs \
            --resource-root apps/desktop/resources/providers/cua-driver/0.8.3-ling.1 \
            --attestation "$build_root/output/source-build-attestation.json" \
            --output-root "$build_root/output"
          echo "LING_CUA_DRIVER_SOURCE_BUILD_ROOT=$build_root/output" >> "$GITHUB_ENV"

      - name: Build provider-bearing macOS product
        env:
          LING_CUA_SIGNING_TIER: test_signed_internal
          LING_CUA_DISTRIBUTION_CHANNEL: internal
          LING_CUA_TEST_AUTHORITY_KIND: managed-internal
          LING_CUA_DRIVER_PACKAGE_PROVIDER: "1"
          LING_CUA_PACKAGE_OUTPUT_ROOT: ${{ github.workspace }}/apps/desktop/release
        run: corepack pnpm --filter @ling-stack/desktop package:mac

      - name: Verify macOS product and write checksum
        shell: bash
        run: |
          set -euo pipefail
          release="apps/desktop/release"
          app="$release/mac-arm64/Ling Stack.app"
          provider="$app/Contents/Resources/providers/cua-driver/0.8.3-ling.1/darwin/ling-cua-driver"
          browser_host="$app/Contents/Resources/browser-host/ling-browser-host"
          browser_host_metadata="$app/Contents/Resources/browser-host/build-metadata.json"

          test -d "$app"
          test -x "$provider"
          test -x "$browser_host"
          test -f "$browser_host_metadata"
          test "$(lipo -archs "$app/Contents/MacOS/Ling Stack")" = "arm64"
          test "$(lipo -archs "$provider")" = "arm64"
          test "$(lipo -archs "$browser_host")" = "arm64"
          codesign --verify --deep --strict "$app"
          codesign --verify --strict "$provider"
          codesign --verify --strict "$browser_host"
          test "$(codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')" = "$LING_CUA_DARWIN_EXPECTED_TEAM_ID"
          test "$(codesign -dv --verbose=4 "$provider" 2>&1 | sed -n 's/^TeamIdentifier=//p')" = "$LING_CUA_DARWIN_EXPECTED_TEAM_ID"
          test "$(codesign -dv --verbose=4 "$browser_host" 2>&1 | sed -n 's/^TeamIdentifier=//p')" = "$LING_CUA_DARWIN_EXPECTED_TEAM_ID"
          node -e 'const fs=require("node:fs"); const value=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (value.platform !== "darwin-arm64" || value.sourceCommit !== process.env.GITHUB_SHA) process.exit(1)' "$browser_host_metadata"
          asar_path="${GITHUB_WORKSPACE}/$app/Contents/Resources/app.asar"
          asar_listing="$(corepack pnpm --filter @ling-stack/desktop exec asar list "$asar_path")"
          if grep -Eq 'node_modules/@ling-stack/browser-host/(dist/native|native|scripts|src|test)(/|$)' <<< "$asar_listing"; then
            echo "Browser Host source or native payload was duplicated inside app.asar." >&2
            exit 1
          fi
          test ! -e "$app/Contents/Resources/app.asar.unpacked/node_modules/@ling-stack/browser-host/native"
          test ! -e "$app/Contents/Resources/app.asar.unpacked/node_modules/@ling-stack/browser-host/dist/native"

          shopt -s nullglob
          dmgs=("$release"/Ling-Stack-*-macos-arm64.dmg)
          test "${#dmgs[@]}" -eq 1
          hdiutil verify "${dmgs[0]}"

          zips=("$release"/Ling-Stack-*-macos-arm64.zip)
          test "${#zips[@]}" -eq 1
          unzip -t "${zips[0]}"

          (
            cd "$release"
            shasum -a 256 "$(basename "${dmgs[0]}")" > checksums.txt
            shasum -a 256 -c checksums.txt
          )

      - name: Run packaged Desktop smoke
        shell: bash
        run: |
          set -euo pipefail
          LING_DESKTOP_SMOKE_EXECUTABLE="${GITHUB_WORKSPACE}/apps/desktop/release/mac-arm64/Ling Stack.app/Contents/MacOS/Ling Stack" \
            LING_DESKTOP_SMOKE_TIMEOUT_MS=50000 \
            node apps/desktop/tests/run-computer-use-smoke.mjs

      - name: Check whitespace
        run: git diff-tree --check --no-commit-id -r HEAD

      - name: Upload macOS product
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ling-stack-macos-arm64-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 3
          path: |
            apps/desktop/release/Ling-Stack-*-macos-arm64.dmg
            apps/desktop/release/checksums.txt

  windows-x64:
    if: inputs.target == 'windows-x64'
    name: Windows x64 Setup
    runs-on:
      - ling-cua-driver-windows-x64-v1
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.15.0

      - name: Require committed Windows package authorization
        id: package-authorization
        shell: pwsh
        run: |
          node apps/desktop/scripts/check-cua-driver-package-authorization.mjs --platform win32-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Explain missing Windows native lock
        if: steps.package-authorization.outputs.authorized != 'true'
        shell: pwsh
        run: |
          throw "Windows packaging is not authorized yet: record the first locked Windows native build in provider-lock.json before building Setup."

      - name: Enter locked MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
          sdk: 10.0.26100.0
          toolset: 14.44

      - name: Enable pnpm and install dependencies
        shell: pwsh
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install locked Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add x86_64-pc-windows-msvc --toolchain 1.97.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows build host
        run: node apps/desktop/scripts/verify-cua-driver-self-hosted-runner.mjs --platform win32-x64

      - name: Run focused package contracts
        run: >-
          node --test
          apps/desktop/tests/chrome-extension-package.test.mjs
          apps/desktop/tests/cua-driver-artifact-layout.test.mjs
          apps/desktop/tests/cua-driver-electron-package.test.mjs
          apps/desktop/tests/windows-cua-driver-provider.test.mjs

      - name: Verify Native Host protocol and daemon bridge
        shell: pwsh
        run: |
          corepack pnpm --filter @ling-stack/browser-host test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm --filter @ling-stack/daemon build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test packages/daemon/test/chrome-browser-native-broker.test.mjs packages/daemon/test/chrome-browser-native-host-process.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build locked Cua Driver once
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP "ling-cua-driver-product/windows"
          node apps/desktop/scripts/build-cua-driver-provider.mjs --platform win32-x64 --work-dir (Join-Path $buildRoot "work") --output-dir (Join-Path $buildRoot "output")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node apps/desktop/scripts/verify-cua-driver-source-build.mjs --resource-root apps/desktop/resources/providers/cua-driver/0.8.3-ling.1 --attestation (Join-Path $buildRoot "output/source-build-attestation.json") --output-root (Join-Path $buildRoot "output")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "LING_CUA_DRIVER_SOURCE_BUILD_ROOT=$(Join-Path $buildRoot 'output')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build provider-bearing Windows product
        env:
          LING_CUA_SIGNING_TIER: unsigned_dev
          LING_CUA_DISTRIBUTION_CHANNEL: development
          LING_CUA_DRIVER_PACKAGE_PROVIDER: "1"
          LING_CUA_PACKAGE_OUTPUT_ROOT: ${{ github.workspace }}\apps\desktop\release
        run: corepack pnpm --filter @ling-stack/desktop package:win

      - name: Verify Windows product and write checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = (Resolve-Path "apps/desktop/release").Path
          $app = Join-Path $release "win-unpacked/Ling Stack.exe"
          $provider = Join-Path $release "win-unpacked/resources/providers/cua-driver/0.8.3-ling.1/win32-x64/payload/ling-cua-driver.exe"
          $seal = Join-Path $release "win-unpacked/resources/providers/cua-driver/0.8.3-ling.1/win32-x64/payload/provider-seal.json"
          $browserHost = Join-Path $release "win-unpacked/resources/browser-host/ling-browser-host.exe"
          $browserHostMetadataPath = Join-Path $release "win-unpacked/resources/browser-host/build-metadata.json"

          foreach ($path in @($app, $provider, $seal, $browserHost, $browserHostMetadataPath)) {
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing packaged file: $path"
            }
          }

          function Assert-X64Pe([string]$path) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0x8664) {
              throw ("Expected x64 PE for {0}; found 0x{1:X4}" -f $path, $machine)
            }
          }
          Assert-X64Pe $app
          Assert-X64Pe $provider
          Assert-X64Pe $browserHost

          $browserHostMetadata = Get-Content -LiteralPath $browserHostMetadataPath -Raw | ConvertFrom-Json
          if ($browserHostMetadata.platform -ne "win32-x64" -or $browserHostMetadata.sourceCommit -ne $env:GITHUB_SHA) {
            throw "Browser Host metadata does not match the packaged source and platform."
          }
          $browserHostHash = (Get-FileHash -LiteralPath $browserHost -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($browserHostHash -ne [string]$browserHostMetadata.hostSha256) {
            throw "Packaged Browser Host hash does not match build metadata."
          }
          $asarPath = Join-Path $release "win-unpacked/resources/app.asar"
          $asarListing = (& corepack pnpm --filter @ling-stack/desktop exec asar list $asarPath) -join "`n"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect packaged app.asar."
          }
          if ($asarListing -match 'node_modules[\\/]@ling-stack[\\/]browser-host[\\/](dist[\\/]native|native|scripts|src|test)([\\/]|$)') {
            throw "Browser Host source or native payload was duplicated inside app.asar."
          }
          $unpackedBrowserHost = Join-Path $release "win-unpacked/resources/app.asar.unpacked/node_modules/@ling-stack/browser-host"
          if ((Test-Path -LiteralPath (Join-Path $unpackedBrowserHost "native")) -or
              (Test-Path -LiteralPath (Join-Path $unpackedBrowserHost "dist/native"))) {
            throw "Browser Host native payload was duplicated outside app.asar."
          }

          $installers = @(Get-ChildItem -Path $release -File -Filter "Ling-Stack-*-windows-x64-setup.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows Setup, found $($installers.Count)"
          }
          foreach ($path in @($app, $provider, $browserHost, $installers[0].FullName)) {
            $signature = Get-AuthenticodeSignature -FilePath $path
            if ([string]$signature.Status -ne "NotSigned") {
              throw "Development product must remain unsigned: $path ($($signature.Status))"
            }
          }

          $hash = Get-FileHash -Path $installers[0].FullName -Algorithm SHA256
          ("{0}  {1}" -f $hash.Hash.ToLowerInvariant(), $installers[0].Name) |
            Set-Content -Encoding ascii (Join-Path $release "checksums.txt")

      - name: Run packaged Desktop smoke
        shell: pwsh
        run: |
          $env:LING_DESKTOP_SMOKE_EXECUTABLE = (Resolve-Path "apps/desktop/release/win-unpacked/Ling Stack.exe").Path
          $env:LING_DESKTOP_SMOKE_TIMEOUT_MS = "50000"
          node apps/desktop/tests/run-computer-use-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check whitespace
        run: git diff-tree --check --no-commit-id -r HEAD

      - name: Upload Windows product
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ling-stack-windows-x64-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 3
          path: |
            apps/desktop/release/Ling-Stack-*-windows-x64-setup.exe
            apps/desktop/release/checksums.txt
