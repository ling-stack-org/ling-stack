name: Desktop artifacts

on:
  workflow_dispatch:
    inputs:
      execution_mode:
        description: Runner pool used by this manual dispatch
        required: true
        default: self-hosted-native
        type: choice
        options:
          - github-hosted
          - self-hosted-native
      native_platform:
        description: Native platform selected for self-hosted-native or github-hosted execution
        required: true
        default: macos
        type: choice
        options:
          - macos
          - windows
          - both
      expected_commit:
        description: Full commit SHA required by self-hosted-native mode
        required: false
        type: string
  pull_request:
    paths:
      - ".github/workflows/desktop-artifacts.yml"
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/api-client/**"
      - "packages/contracts/**"
      - "packages/core/**"
      - "packages/daemon/**"
      - "packages/plugin-sdk/**"
      - "packages/providers/**"
      - "packages/runner-pi/**"
      - "packages/conversation-ui-core/**"
      - "packages/conversation-ui-react/**"
      - "docs/release/evidence/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/desktop-artifacts.yml"
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/api-client/**"
      - "packages/contracts/**"
      - "packages/core/**"
      - "packages/daemon/**"
      - "packages/plugin-sdk/**"
      - "packages/providers/**"
      - "packages/runner-pi/**"
      - "packages/conversation-ui-core/**"
      - "packages/conversation-ui-react/**"
      - "docs/release/evidence/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

concurrency:
  group: desktop-artifacts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  cua-driver-self-hosted-native:
    if: github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'self-hosted-native'
    uses: ./.github/workflows/cua-driver-self-hosted-native.yml
    with:
      platform: ${{ inputs.native_platform }}
      expected_commit: ${{ inputs.expected_commit }}
    permissions:
      contents: read

  cua-driver-signing-feasibility:
    if: github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'github-hosted'
    name: Cua Driver signing and final artifact fixture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # These are disposable, certificate-free fixtures.  No PFX, trust
        # root, hosted signing service, or production credential is required.
        os: ${{ fromJSON(inputs.native_platform == 'windows' && '["windows-2022"]' || inputs.native_platform == 'macos' && '["macos-15"]' || '["ubuntu-24.04","macos-15","windows-2022"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0

      - name: Enable pnpm
        run: corepack enable

      - name: Install fixture dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Run certificate-free hook-order and artifact fixtures
        run: node apps/desktop/tests/cua-driver-signing-feasibility.test.mjs

      - name: Run source-build promotion contract fixtures
        if: runner.os != 'Windows'
        run: node --test apps/desktop/tests/cua-driver-source-build-promotion.test.mjs

      - name: Run Windows release evidence and handoff contract fixtures
        run: >-
          node --test
          apps/desktop/tests/windows-acceptance-report.test.mjs
          apps/desktop/tests/windows-release-evidence-contracts.test.mjs
          apps/desktop/tests/windows-handoff-contracts.test.mjs
          apps/desktop/tests/finalize-windows-signed-acceptance.test.mjs
          apps/desktop/tests/produce-windows-acceptance-handoff.test.mjs
          apps/desktop/tests/windows-release-hardening.test.mjs
          apps/desktop/tests/windows-cua-driver-provider.test.mjs

      - name: Parse the Windows acceptance runner with PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "apps/desktop/tests/run-windows-acceptance.ps1").Path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "Windows acceptance runner has PowerShell parser errors"
          }

  cua-driver-source-build-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'github-hosted' && inputs.native_platform != 'windows'
    name: Cua Driver locked source build (macOS arm64)
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.15.0

      - name: Select locked Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer

      - name: Test atomic Cua Driver package publisher and Mach-O identity normalizer
        run: node --test apps/desktop/tests/cua-driver-package-publisher.test.mjs apps/desktop/tests/cua-driver-macho-identity-normalizer.test.mjs

      - name: Install locked Rust toolchain and targets
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup target add aarch64-apple-darwin --toolchain 1.97.1

      - name: Build and attest candidate A
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/ling-cua-driver-source-build"
          node apps/desktop/scripts/build-cua-driver-provider.mjs \
            --platform darwin \
            --work-dir "${root}/a" \
            --output-dir "${root}/a/output"
          node apps/desktop/scripts/verify-cua-driver-source-build.mjs \
            --resource-root apps/desktop/resources/providers/cua-driver/0.8.3-ling.1 \
            --attestation "${root}/a/output/source-build-attestation.json" \
            --output-root "${root}/a/output"

      - name: Build and attest candidate B
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/ling-cua-driver-source-build"
          node apps/desktop/scripts/build-cua-driver-provider.mjs \
            --platform darwin \
            --work-dir "${root}/b" \
            --output-dir "${root}/b/output"
          node apps/desktop/scripts/verify-cua-driver-source-build.mjs \
            --resource-root apps/desktop/resources/providers/cua-driver/0.8.3-ling.1 \
            --attestation "${root}/b/output/source-build-attestation.json" \
            --output-root "${root}/b/output"

      - name: Compare repeated arm64 pre-sign outputs
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/ling-cua-driver-source-build"
          node apps/desktop/scripts/verify-cua-driver-source-build.mjs \
            --resource-root apps/desktop/resources/providers/cua-driver/0.8.3-ling.1 \
            --compare-a "${root}/a/output" \
            --compare-b "${root}/b/output"

      - name: Resolve committed macOS package authorization
        id: package-authorization
        run: node apps/desktop/scripts/check-cua-driver-package-authorization.mjs --platform darwin

      - name: Install Desktop packaging dependencies
        if: steps.package-authorization.outputs.authorized == 'true'
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Run production macOS arm64 package wrapper
        if: steps.package-authorization.outputs.authorized == 'true'
        run: >-
          node apps/desktop/tests/run-cua-driver-signing-builder-fixture.mjs
          --source-root "${RUNNER_TEMP}/ling-cua-driver-source-build/a/output"

      - name: Upload macOS Electron Builder hook traces
        if: steps.package-authorization.outputs.authorized == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cua-driver-electron-builder-signing-macos
          path: apps/desktop/test-results/cua-driver-signing-feasibility
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS source-build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cua-driver-source-build-macos-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/ling-cua-driver-source-build/a/output
            ${{ runner.temp }}/ling-cua-driver-source-build/b/output

  cua-driver-source-build-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'github-hosted' && inputs.native_platform != 'macos'
    name: Cua Driver locked source build (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.15.0

      - name: Enter locked MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
          sdk: 10.0.26100.0
          toolset: 14.44.35211
          vsversion: 2022

      - name: Test atomic Cua Driver package publisher and Mach-O identity normalizer
        shell: pwsh
        run: node --test apps/desktop/tests/cua-driver-package-publisher.test.mjs apps/desktop/tests/cua-driver-macho-identity-normalizer.test.mjs

      - name: Install locked Rust toolchain and target
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup target add x86_64-pc-windows-msvc --toolchain 1.97.1

      - name: Build and attest candidate A
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "ling-cua-driver-source-build"
          node apps/desktop/scripts/build-cua-driver-provider.mjs --platform win32-x64 --work-dir (Join-Path $root "a") --output-dir (Join-Path $root "a/output")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node apps/desktop/scripts/verify-cua-driver-source-build.mjs --resource-root apps/desktop/resources/providers/cua-driver/0.8.3-ling.1 --attestation (Join-Path $root "a/output/source-build-attestation.json") --output-root (Join-Path $root "a/output")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and attest candidate B
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "ling-cua-driver-source-build"
          node apps/desktop/scripts/build-cua-driver-provider.mjs --platform win32-x64 --work-dir (Join-Path $root "b") --output-dir (Join-Path $root "b/output")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node apps/desktop/scripts/verify-cua-driver-source-build.mjs --resource-root apps/desktop/resources/providers/cua-driver/0.8.3-ling.1 --attestation (Join-Path $root "b/output/source-build-attestation.json") --output-root (Join-Path $root "b/output")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compare repeated x64 pre-sign outputs
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "ling-cua-driver-source-build"
          node apps/desktop/scripts/verify-cua-driver-source-build.mjs --resource-root apps/desktop/resources/providers/cua-driver/0.8.3-ling.1 --compare-a (Join-Path $root "a/output") --compare-b (Join-Path $root "b/output")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve committed Windows package authorization
        id: package-authorization
        shell: pwsh
        run: node apps/desktop/scripts/check-cua-driver-package-authorization.mjs --platform win32-x64

      - name: Install Desktop packaging dependencies
        if: steps.package-authorization.outputs.authorized == 'true'
        shell: pwsh
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Run production Windows package wrapper
        if: steps.package-authorization.outputs.authorized == 'true'
        shell: pwsh
        run: |
          $sourceRoot = Join-Path $env:RUNNER_TEMP "ling-cua-driver-source-build/a/output"
          node apps/desktop/tests/run-cua-driver-signing-builder-fixture.mjs --source-root $sourceRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows Electron Builder hook trace
        if: steps.package-authorization.outputs.authorized == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cua-driver-electron-builder-signing-windows
          path: apps/desktop/test-results/cua-driver-signing-feasibility
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows source-build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cua-driver-source-build-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/ling-cua-driver-source-build/a/output
            ${{ runner.temp }}/ling-cua-driver-source-build/b/output

  cua-driver-source-build-promotion-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'github-hosted' && inputs.native_platform != 'windows'
    name: Cua Driver source-build promotion proposal (macOS arm64)
    needs: cua-driver-source-build-macos
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.15.0

      - name: Download macOS source-build evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cua-driver-source-build-macos-arm64
          path: ${{ runner.temp }}/ling-cua-driver-source-build-download

      - name: Generate review-only macOS source-build promotion proposal
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/ling-cua-driver-source-build-download"
          node apps/desktop/scripts/promote-cua-driver-source-build.mjs \
            --platform darwin \
            --candidate-a "${root}/a/output" \
            --candidate-b "${root}/b/output" \
            --output-dir "${root}/promotion"

      - name: Upload review-only macOS promotion proposal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cua-driver-source-build-promotion-macos-arm64
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/ling-cua-driver-source-build-download/promotion/**

  cua-driver-source-build-promotion-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'github-hosted' && inputs.native_platform != 'macos'
    name: Cua Driver source-build promotion proposal (Windows x64)
    needs: cua-driver-source-build-windows
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.15.0

      - name: Download Windows source-build evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cua-driver-source-build-windows-x64
          path: ${{ runner.temp }}/ling-cua-driver-source-build-download

      - name: Generate review-only Windows source-build promotion proposal
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "ling-cua-driver-source-build-download"
          node apps/desktop/scripts/promote-cua-driver-source-build.mjs --platform win32-x64 --candidate-a (Join-Path $root "a/output") --candidate-b (Join-Path $root "b/output") --output-dir (Join-Path $root "promotion")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload review-only Windows promotion proposal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cua-driver-source-build-promotion-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/ling-cua-driver-source-build-download/promotion/**

  macos-unsigned:
    if: github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'github-hosted' && inputs.native_platform != 'windows'
    name: macOS unsigned arm64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install Chromium for Web E2E
        run: corepack pnpm --filter @ling-stack/web exec playwright install chromium

      - name: Typecheck Desktop
        run: corepack pnpm --filter @ling-stack/desktop typecheck

      - name: Build Desktop
        run: corepack pnpm --filter @ling-stack/desktop build

      - name: Check Web lint and i18n
        run: |
          corepack pnpm --filter @ling-stack/web lint
          corepack pnpm --filter @ling-stack/web check:i18n

      - name: Run Desktop Node tests
        run: node --test apps/desktop/tests/*.test.mjs

      - name: Run Computer Use contract tests
        run: node --test packages/contracts/test/computer-use.test.mjs packages/api-client/test/computer-use.test.mjs

      - name: Run complete core suite
        run: corepack pnpm --filter @ling-stack/core test

      - name: Run complete daemon suite
        run: corepack pnpm --filter @ling-stack/daemon test

      - name: Run complete Pi runner suite
        run: corepack pnpm --filter @ling-stack/runner-pi test

      - name: Validate release evidence schemas
        run: corepack pnpm --filter @ling-stack/desktop verify:release-schemas

      - name: Run PiP renderer tests
        run: corepack pnpm --filter @ling-stack/desktop exec playwright test --config tests/playwright.renderer.config.mjs

      - name: Run Web Desktop bridge tests
        run: corepack pnpm --filter @ling-stack/web exec playwright test e2e/app-shell-selectors.spec.ts e2e/desktop-computer-use-bridge.spec.ts e2e/workspace.spec.ts

      - name: Run fake Computer Use smoke
        run: node apps/desktop/tests/run-computer-use-smoke.mjs

      - name: Run Computer Use performance and cleanup harness
        shell: bash
        run: |
          mkdir -p apps/desktop/test-results
          node --expose-gc apps/desktop/tests/computer-use-performance-harness.mjs \
            | tee apps/desktop/test-results/computer-use-performance-macos.json

      - name: Verify Computer Use screenshot baselines
        if: runner.arch == 'ARM64'
        run: corepack pnpm --filter @ling-stack/desktop exec electron tests/screenshot-app

      - name: Upload Computer Use screenshot diagnostics
        if: failure() && runner.arch == 'ARM64'
        uses: actions/upload-artifact@v4
        with:
          name: computer-use-screenshot-diagnostics-macos-arm64
          path: apps/desktop/test-results/computer-use-screenshot-baselines
          if-no-files-found: ignore
          overwrite: true

      - name: Build unsigned macOS artifacts
        run: corepack pnpm --filter @ling-stack/desktop package:mac

      - name: Verify macOS bundles and archives
        shell: bash
        run: |
          set -euo pipefail

          arm_app="apps/desktop/release/mac-arm64/Ling Stack.app"
          test -d "$arm_app"

          test "$(plutil -extract CFBundleIdentifier raw -o - "$arm_app/Contents/Info.plist")" = "com.lingstack.desktop"
          test "$(plutil -extract CFBundleIconFile raw -o - "$arm_app/Contents/Info.plist")" = "icon.icns"
          cmp apps/desktop/build/icon.icns "$arm_app/Contents/Resources/icon.icns"
          test "$(lipo -archs "$arm_app/Contents/MacOS/Ling Stack")" = "arm64"

          arm_signature="$(codesign -dv --verbose=4 "$arm_app" 2>&1 || true)"
          signature_report="${arm_signature}"
          if grep -q "Authority=Developer ID Application" <<<"$signature_report"; then
            echo "Unsigned macOS job unexpectedly produced a Developer ID artifact" >&2
            exit 1
          fi
          if grep -Eq "TeamIdentifier=[A-Z0-9]{10}" <<<"$signature_report"; then
            echo "Unsigned macOS job unexpectedly produced a Team ID" >&2
            exit 1
          fi
          printf '%s\n' "$signature_report" > apps/desktop/release/UNSIGNED-CODESIGN-STATUS.txt

          test -f "$arm_app/Contents/Resources/bundled/cua-driver/.ling-plugin/plugin.json"

          preview_root="apps/desktop/dist/renderer/computer-use-preview"
          test "$(find "$preview_root" -type f | wc -l | tr -d ' ')" -eq 13
          test "$(find "$preview_root/assets" -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 9
          test "$(find "$preview_root/assets" -maxdepth 1 -type f -name '*.woff2' | wc -l | tr -d ' ')" -eq 7
          test -f "$preview_root/third-party-licenses/Inter-OFL-1.1.txt"
          while IFS= read -r asset; do
            grep -Fq "./assets/$(basename "$asset")" "$preview_root/index.html"
          done < <(find "$preview_root/assets" -maxdepth 1 -type f \( -name '*.css' -o -name '*.js' \) | sort)
          preview_stylesheet="$(find "$preview_root/assets" -maxdepth 1 -type f -name '*.css' -print -quit)"
          test -n "$preview_stylesheet"
          while IFS= read -r font; do
            grep -Fq "$(basename "$font")" "$preview_stylesheet"
          done < <(find "$preview_root/assets" -maxdepth 1 -type f -name '*.woff2' | sort)

          verify_packaged_preview() {
            local app_bundle="$1"
            local asar_path="${GITHUB_WORKSPACE}/${app_bundle}/Contents/Resources/app.asar"
            local listing
            listing="$(mktemp)"
            corepack pnpm --filter @ling-stack/desktop exec asar list "$asar_path" > "$listing"
            test "$(grep -Ec '^/dist/renderer/computer-use-preview/assets/[^/]+\.woff2$' "$listing")" -eq 7
            test "$(grep -Ec '^/dist/renderer/computer-use-preview/assets/[^/]+\.css$' "$listing")" -eq 1
            test "$(grep -Ec '^/dist/renderer/computer-use-preview/assets/[^/]+\.js$' "$listing")" -eq 1
            grep -Fxq '/dist/renderer/computer-use-preview/index.html' "$listing"
            grep -Fxq '/dist/renderer/computer-use-preview/messages.js' "$listing"
            grep -Fxq '/dist/renderer/computer-use-preview/preview-view-model.js' "$listing"
            grep -Fxq '/dist/renderer/computer-use-preview/third-party-licenses/Inter-OFL-1.1.txt' "$listing"
            if grep -Fq '/node_modules/@fontsource-variable/inter' "$listing"; then
              echo "Packaged app unexpectedly contains the build-time Fontsource package" >&2
              return 1
            fi
            rm -f "$listing"
          }
          verify_packaged_preview "$arm_app"

          dmg_count=0
          for artifact in apps/desktop/release/Ling-Stack-*-macos-arm64.dmg; do
            hdiutil verify "$artifact"
            dmg_count=$((dmg_count + 1))
          done
          test "$dmg_count" -eq 1

          zip_count=0
          for artifact in apps/desktop/release/*-macos-arm64.zip; do
            unzip -t "$artifact"
            zip_count=$((zip_count + 1))
          done
          test "$zip_count" -eq 1

          (
            cd apps/desktop/release
            shasum -a 256 Ling-Stack-*-macos-arm64.dmg > checksums-macos.txt
            shasum -a 256 -c checksums-macos.txt
          )

      - name: Run arm64 packaged fake smoke
        shell: bash
        run: |
          set -euo pipefail
          executable="${GITHUB_WORKSPACE}/apps/desktop/release/mac-arm64/Ling Stack.app/Contents/MacOS/Ling Stack"
          test -x "$executable"
          LING_DESKTOP_SMOKE_EXECUTABLE="$executable" \
            LING_DESKTOP_SMOKE_TIMEOUT_MS=50000 \
            node apps/desktop/tests/run-computer-use-smoke.mjs

      - name: Run mounted-DMG fake smoke
        shell: bash
        run: |
          set -euo pipefail

          mount_point=""
          mounted=0
          cleanup_mount() {
            if [[ "$mounted" -eq 1 && -n "$mount_point" ]]; then
              hdiutil detach "$mount_point" >/dev/null 2>&1 \
                || hdiutil detach -force "$mount_point" >/dev/null 2>&1 \
                || true
              mounted=0
            fi
            if [[ -n "$mount_point" && -d "$mount_point" ]]; then
              rmdir "$mount_point" >/dev/null 2>&1 || true
            fi
            mount_point=""
          }
          cleanup_on_exit() {
            status=$?
            cleanup_mount
            trap - EXIT
            exit "$status"
          }
          trap cleanup_on_exit EXIT

          dmg_count=0
          for artifact in apps/desktop/release/Ling-Stack-*-macos-arm64.dmg; do
            mount_point="$(mktemp -d "${RUNNER_TEMP}/ling-desktop-dmg.XXXXXX")"
            mounted=1
            hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$artifact" >/dev/null
            executable="$mount_point/Ling Stack.app/Contents/MacOS/Ling Stack"
            test -x "$executable"
            LING_DESKTOP_SMOKE_EXECUTABLE="$executable" \
              LING_DESKTOP_SMOKE_TIMEOUT_MS=50000 \
              node apps/desktop/tests/run-computer-use-smoke.mjs
            hdiutil detach "$mount_point" >/dev/null
            mounted=0
            rmdir "$mount_point"
            mount_point=""
            dmg_count=$((dmg_count + 1))
          done
          test "$dmg_count" -eq 1
          trap - EXIT

      - name: Check tracked-file whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git diff-tree --check --no-commit-id -r HEAD
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ling-stack-desktop-macos-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/release/Ling-Stack-*-macos-arm64.dmg
            apps/desktop/release/*-macos-arm64.zip
            apps/desktop/release/checksums-macos.txt
            apps/desktop/release/UNSIGNED-CODESIGN-STATUS.txt
            apps/desktop/test-results/computer-use-performance-macos.json

  windows-unsigned:
    if: github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'github-hosted' && inputs.native_platform != 'macos'
    name: Windows unsigned x64
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0

      - name: Enter locked MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
          sdk: 10.0.26100.0
          toolset: 14.44

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install Chromium for Web E2E
        run: corepack pnpm --filter @ling-stack/web exec playwright install chromium

      - name: Typecheck Desktop
        run: corepack pnpm --filter @ling-stack/desktop typecheck

      - name: Build Desktop
        run: corepack pnpm --filter @ling-stack/desktop build

      - name: Check Web lint and i18n
        shell: pwsh
        run: |
          corepack pnpm --filter @ling-stack/web lint
          corepack pnpm --filter @ling-stack/web check:i18n

      - name: Run Desktop Node tests
        run: node --test apps/desktop/tests/*.test.mjs

      - name: Run Computer Use contract tests
        run: node --test packages/contracts/test/computer-use.test.mjs packages/api-client/test/computer-use.test.mjs

      - name: Run complete core suite
        run: corepack pnpm --filter @ling-stack/core test

      - name: Run complete daemon suite
        run: corepack pnpm --filter @ling-stack/daemon test

      - name: Run complete Pi runner suite
        run: corepack pnpm --filter @ling-stack/runner-pi test

      - name: Run PiP renderer tests
        run: corepack pnpm --filter @ling-stack/desktop exec playwright test --config tests/playwright.renderer.config.mjs

      - name: Run Web Desktop bridge tests
        run: corepack pnpm --filter @ling-stack/web exec playwright test e2e/app-shell-selectors.spec.ts e2e/desktop-computer-use-bridge.spec.ts e2e/workspace.spec.ts

      - name: Run fake Computer Use smoke
        run: node apps/desktop/tests/run-computer-use-smoke.mjs

      - name: Run Computer Use performance and cleanup harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/desktop/test-results | Out-Null
          node --expose-gc apps/desktop/tests/computer-use-performance-harness.mjs |
            Tee-Object -FilePath apps/desktop/test-results/computer-use-performance-windows.json

      - name: Acquire and verify pinned Windows Cua Driver provider in runner temp
        shell: pwsh
        run: |
          $providerDirectory = Join-Path $env:RUNNER_TEMP "ling-cua-driver-rs-v0.8.3"
          node apps/desktop/tests/verify-windows-cua-driver-provider.mjs --output-dir $providerDirectory
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $providerBinary = Join-Path $providerDirectory "provider/cua-driver-rs-0.8.3-windows-x86_64/cua-driver.exe"
          if (!(Test-Path -LiteralPath $providerBinary -PathType Leaf)) {
            throw "Pinned provider binary is missing after acquisition"
          }
          "LING_WINDOWS_ACCEPTANCE_PROVIDER=$providerBinary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build unsigned Windows artifact
        run: corepack pnpm --filter @ling-stack/desktop package:win

      - name: Verify Windows executable, installer, architecture, and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = (Resolve-Path "apps/desktop/release").Path
          $unpackedExe = Join-Path $release "win-unpacked/Ling Stack.exe"
          if (!(Test-Path $unpackedExe)) {
            throw "win-unpacked Ling Stack.exe is missing"
          }

          $bytes = [System.IO.File]::ReadAllBytes($unpackedExe)
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) {
            throw ("Expected PE32+ x64 machine 0x8664, found 0x{0:X4}" -f $machine)
          }

          $pluginManifest = Join-Path $release "win-unpacked/resources/bundled/cua-driver/.ling-plugin/plugin.json"
          if (!(Test-Path $pluginManifest)) {
            throw "Bundled Cua Driver plugin shell manifest is missing"
          }
          $elevateHelper = Join-Path $release "win-unpacked/resources/elevate.exe"
          if (Test-Path $elevateHelper) {
            throw "Per-user asInvoker artifact unexpectedly contains elevate.exe"
          }

          $installers = @(
            Get-ChildItem -Path $release -File -Filter "*.exe" |
              Where-Object { $_.Name -notmatch "__uninstaller|^Uninstall" } |
              Sort-Object Name
          )
          if ($installers.Count -ne 1) {
            throw ("Expected exactly one NSIS installer, found {0}" -f $installers.Count)
          }
          if ($installers[0].Name -notmatch '^Ling-Stack-.+-windows-x64-setup\.exe$') {
            throw ("Unexpected Windows installer name: {0}" -f $installers[0].Name)
          }
          $installerPath = $installers[0].FullName
          node apps/desktop/tests/verify-windows-app-icons.mjs apps/desktop/build/icon.ico $unpackedExe $installerPath
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $checksumTargets = @()
          foreach ($artifact in $installers) {
            $checksumTargets += [PSCustomObject]@{ Path = $artifact.FullName; Name = $artifact.Name }
          }
          $checksumLines = foreach ($artifact in $checksumTargets) {
            $hash = Get-FileHash -Path $artifact.Path -Algorithm SHA256
            "{0}  {1}" -f $hash.Hash.ToLowerInvariant(), $artifact.Name
          }
          $checksumLines | Set-Content -Encoding ascii (Join-Path $release "checksums-windows.txt")

          $signatureTargets = @($unpackedExe) + @($installers | ForEach-Object { $_.FullName })
          $signatures = foreach ($artifactPath in $signatureTargets) {
            $signature = Get-AuthenticodeSignature -FilePath $artifactPath
            if ([string]$signature.Status -ne "NotSigned") {
              throw ("Unsigned Windows job produced a signed or indeterminate artifact: {0} ({1})" -f $artifactPath, $signature.Status)
            }
            [PSCustomObject]@{
              File = Split-Path -Leaf $artifactPath
              Status = [string]$signature.Status
              StatusMessage = $signature.StatusMessage
            }
          }
          $signatures | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $release "AUTHENTICODE-STATUS.json")

      - name: Run packaged fake Computer Use smoke
        shell: pwsh
        run: |
          $env:LING_DESKTOP_SMOKE_EXECUTABLE = (Resolve-Path "apps/desktop/release/win-unpacked/Ling Stack.exe").Path
          $env:LING_DESKTOP_SMOKE_TIMEOUT_MS = "50000"
          node apps/desktop/tests/run-computer-use-smoke.mjs

      - name: Install, smoke, and uninstall unsigned NSIS artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = (Resolve-Path "apps/desktop/release").Path
          $installers = @(
            Get-ChildItem -Path $release -File -Filter "*.exe" |
              Where-Object { $_.Name -notmatch "__uninstaller|^Uninstall" } |
              Sort-Object Name
          )
          if ($installers.Count -ne 1) {
            throw ("Expected exactly one NSIS installer, found {0}" -f $installers.Count)
          }
          $installer = $installers[0]

          $programsRoot = Join-Path $env:LOCALAPPDATA "Programs"
          function Find-LingDesktopInstallRoot {
            if (!(Test-Path $programsRoot)) {
              return
            }
            Get-ChildItem -Path $programsRoot -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -eq "Ling Stack.exe" -or $_.Name -eq "Uninstall Ling Stack.exe" } |
              ForEach-Object { $_.DirectoryName } |
              Sort-Object -Unique
          }
          function Invoke-BoundedProcess {
            param(
              [Parameter(Mandatory = $true)][string]$FilePath,
              [string[]]$ArgumentList = @(),
              [int]$TimeoutSeconds = 120
            )
            $process = Start-Process -FilePath $FilePath -ArgumentList $ArgumentList -PassThru
            if (!$process.WaitForExit($TimeoutSeconds * 1000)) {
              $taskkill = Join-Path $env:WINDIR "System32/taskkill.exe"
              if (Test-Path -LiteralPath $taskkill -PathType Leaf) {
                & $taskkill /PID $process.Id /T /F *> $null
              } else {
                try {
                  $process.Kill()
                } catch {
                  # The timeout remains fatal even if direct process cleanup fails.
                }
              }
              throw ("Process timed out after {0}s: {1}" -f $TimeoutSeconds, $FilePath)
            }
            return [int]$process.ExitCode
          }
          $preexistingInstallRoots = @(Find-LingDesktopInstallRoot)
          if ($preexistingInstallRoots.Count -ne 0) {
            throw ("Ling Stack is already installed in the hosted runner profile: {0}" -f $preexistingInstallRoots[0])
          }

          $installRoot = $null
          $installedExe = $null
          $installedManifest = $null
          $primaryFailure = $null
          $cleanupFailure = $null
          try {
            $installExitCode = Invoke-BoundedProcess -FilePath $installer.FullName -ArgumentList @("/S") -TimeoutSeconds 120
            if ($installExitCode -ne 0) {
              throw ("NSIS installer failed with exit code {0}" -f $installExitCode)
            }

            $installedRoots = @(Find-LingDesktopInstallRoot)
            if ($installedRoots.Count -ne 1) {
              throw ("Expected exactly one Ling Stack install root, found {0}" -f $installedRoots.Count)
            }
            $installRoot = $installedRoots[0]
            $installedExe = Join-Path $installRoot "Ling Stack.exe"
            $installedManifest = Join-Path $installRoot "resources/bundled/cua-driver/.ling-plugin/plugin.json"
            if (!(Test-Path $installedExe) -or !(Test-Path $installedManifest)) {
              throw "Installed Desktop executable or Cua Driver plugin shell is missing"
            }

            $env:LING_DESKTOP_SMOKE_EXECUTABLE = $installedExe
            $env:LING_DESKTOP_SMOKE_TIMEOUT_MS = "50000"
            & node apps/desktop/tests/run-computer-use-smoke.mjs
            if ($LASTEXITCODE -ne 0) {
              throw ("Installed Desktop fake smoke failed with exit code {0}" -f $LASTEXITCODE)
            }
          } catch {
            $primaryFailure = $_
          } finally {
            try {
              if (!$installRoot) {
                $installedRoots = @(Find-LingDesktopInstallRoot)
                if ($installedRoots.Count -eq 1) {
                  $installRoot = $installedRoots[0]
                  $installedExe = Join-Path $installRoot "Ling Stack.exe"
                  $installedManifest = Join-Path $installRoot "resources/bundled/cua-driver/.ling-plugin/plugin.json"
                }
              }
              if ($installRoot -and (Test-Path $installRoot)) {
                $uninstaller = Get-ChildItem -Path $installRoot -File -Filter "Uninstall*.exe" |
                  Sort-Object Name |
                  Select-Object -First 1
                if (!$uninstaller) {
                  throw "NSIS uninstaller is missing"
                }
                $uninstallExitCode = Invoke-BoundedProcess -FilePath $uninstaller.FullName -ArgumentList @("/S") -TimeoutSeconds 120
                if ($uninstallExitCode -ne 0) {
                  throw ("NSIS uninstaller failed with exit code {0}" -f $uninstallExitCode)
                }
                for ($attempt = 0; $attempt -lt 40 -and (Test-Path $installRoot); $attempt += 1) {
                  Start-Sleep -Milliseconds 250
                }
                if (Test-Path $installRoot) {
                  throw ("NSIS uninstall left the install root behind: {0}" -f $installRoot)
                }
              }
            } catch {
              $cleanupFailure = $_
            }
          }

          if ($primaryFailure -and $cleanupFailure) {
            throw ("NSIS validation failed: {0}; cleanup also failed: {1}" -f $primaryFailure.Exception.Message, $cleanupFailure.Exception.Message)
          }
          if ($primaryFailure) {
            throw $primaryFailure
          }
          if ($cleanupFailure) {
            throw $cleanupFailure
          }

      - name: Write diagnostic Windows acceptance preflight
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path apps/desktop/test-results | Out-Null
          if (!(Test-Path -LiteralPath "apps/desktop/release" -PathType Container)) {
            Write-Host "Skipping Windows acceptance preflight because packaging did not produce a release directory."
            exit 0
          }
          $release = (Resolve-Path "apps/desktop/release").Path
          $installers = @(
            Get-ChildItem -Path $release -File -Filter "*.exe" |
              Where-Object { $_.Name -notmatch "__uninstaller|^Uninstall" } |
              Sort-Object Name
          )
          $installerPath = if ($installers.Count -eq 1) { $installers[0].FullName } else { $null }
          & apps/desktop/tests/run-windows-acceptance.ps1 `
            -Mode Preflight `
            -Output apps/desktop/test-results/windows-acceptance-preflight.json `
            -LingAppPath "apps/desktop/release/win-unpacked/Ling Stack.exe" `
            -LingInstallerPath $installerPath `
            -ProviderBinary $env:LING_WINDOWS_ACCEPTANCE_PROVIDER
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $report = Get-Content apps/desktop/test-results/windows-acceptance-preflight.json -Raw | ConvertFrom-Json -Depth 32
          if ($report.summary.releaseReady -eq $true -or $report.summary.fullAcceptanceStatus -eq "PASS") {
            throw "Unsigned diagnostic preflight must never claim Full Windows acceptance"
          }
          foreach ($gateId in @("candidate-binding", "install-cleanliness", "provider-verification")) {
            $gate = @($report.gates | Where-Object { $_.id -eq $gateId })
            if ($gate.Count -ne 1 -or $gate[0].status -ne "PASS") {
              $observed = if ($gate.Count -eq 1) { $gate[0].status } else { "missing" }
              throw ("Unsigned diagnostic preflight did not prove {0}: {1}" -f $gateId, $observed)
            }
          }
          $providerSmokeGate = @($report.gates | Where-Object { $_.id -eq "provider-smoke" })
          if ($providerSmokeGate.Count -ne 1 -or $providerSmokeGate[0].status -ne "SKIP") {
            throw "Unsigned diagnostic preflight must skip, not pass or fail, real provider smoke"
          }

      - name: Upload Windows acceptance preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ling-stack-desktop-windows-acceptance-preflight
          if-no-files-found: warn
          retention-days: 14
          path: apps/desktop/test-results/windows-acceptance-preflight.json

      - name: Check tracked-file whitespace
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          } else {
            git diff-tree --check --no-commit-id -r HEAD
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ling-stack-desktop-windows-x64-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/win-unpacked/Ling Stack.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/checksums-windows.txt
            apps/desktop/release/AUTHENTICODE-STATUS.json
            apps/desktop/test-results/computer-use-performance-windows.json

  desktop-checksums:
    if: github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'github-hosted' && inputs.native_platform == 'both'
    name: Desktop installer checksums
    needs:
      - macos-unsigned
      - windows-unsigned
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ling-stack-desktop-macos-unsigned
          path: inputs/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ling-stack-desktop-windows-x64-unsigned
          path: inputs/windows

      - name: Generate installer checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          mapfile -t installers < <(
            find inputs -type f \
              \( -name 'Ling-Stack-*-macos-arm64.dmg' -o -name 'Ling-Stack-*-windows-x64-setup.exe' \) \
              | sort
          )
          test "${#installers[@]}" -eq 2
          for installer in "${installers[@]}"; do
            cp "$installer" output/
          done
          (
            cd output
            sha256sum Ling-Stack-*-macos-arm64.dmg Ling-Stack-*-windows-x64-setup.exe > checksums.txt
            sha256sum --check checksums.txt
          )

      - name: Upload unified checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ling-stack-desktop-checksums
          if-no-files-found: error
          retention-days: 14
          path: output/checksums.txt
