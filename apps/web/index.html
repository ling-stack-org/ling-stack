<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const bootstrap = localStorage.getItem("ling-stack.themeBootstrapPreference");
          const saved = localStorage.getItem("ling-stack.themePreference");
          const preference =
            bootstrap === "light" || bootstrap === "dark" || bootstrap === "system"
              ? bootstrap
              : saved === "light" || saved === "dark" || saved === "system"
                ? saved
                : "system";
          const theme =
            preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : preference;
          document.documentElement.dataset.theme = theme === "system" ? "light" : theme;
          document.documentElement.dataset.themePreference = preference;
          document.documentElement.style.colorScheme = document.documentElement.dataset.theme;
        } catch {
          document.documentElement.dataset.theme = "light";
          document.documentElement.dataset.themePreference = "system";
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Ling Stack</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
