<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ling for Chrome</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon-128.png" alt="" />
        <div>
          <h1 data-i18n="title">Ling for Chrome</h1>
          <p id="status" aria-live="polite">Checking connection...</p>
        </div>
      </header>
      <section class="connection-state">
        <p id="description"></p>
        <p id="active-tab"></p>
      </section>
      <section class="privacy-disclosure" role="note">
        <p data-i18n="dataDisclosure">For browser tasks you approve in Ling, this extension may share HTTP(S) page URLs, visible text, interactive labels, and visible screenshots with your local Ling app.</p>
        <p data-i18n="privacy">Ling does not read Chrome passwords, cookies, history, or bookmarks.</p>
      </section>
      <button id="primary-action" type="button" disabled></button>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
